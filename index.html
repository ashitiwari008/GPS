<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="theme-color" content="#111827"><title>GPS Location Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}.app{max-width:760px;margin:auto;min-height:100vh;background:white;padding:env(safe-area-inset-top) 16px 24px}.head{padding:20px 4px 12px}.head h1{font-size:24px;margin:0 0 5px}.head p{margin:0;color:#6b7280;font-size:14px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0000000d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:520px){.grid{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input{width:100%;font-size:18px;padding:13px;border:1px solid #d1d5db;border-radius:12px;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb22}.btn{width:100%;border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:700;margin-top:14px;background:#2563eb;color:#fff}.btn.secondary{background:#111827}.status{margin-top:12px;padding:12px;border-radius:12px;background:#ecfdf5;color:#065f46;font-weight:700;font-size:14px}.coords{font-size:14px;line-height:1.7}.badge{display:inline-block;background:#fef3c7;color:#92400e;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:800}.mapwrap{position:relative;width:100%;height:55vh;min-height:380px;border-radius:16px;overflow:hidden;background:#e5e7eb}.mapwrap iframe{width:100%;height:100%;border:0}.pin{position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:42px;filter:drop-shadow(0 2px 2px #0006);pointer-events:none}.note{font-size:12px;color:#6b7280;line-height:1.5;margin-top:10px}
</style></head><body><main class="app"><div class="head"><h1>GPS Location Simulator</h1><p>Manual coordinates are shown only inside this app.</p></div>
<div class="card"><span class="badge">SIMULATED LOCATION</span><div class="grid" style="margin-top:14px"><div><label>Latitude</label><input id="lat" type="number" step="0.000001" inputmode="decimal" placeholder="25.685476"></div><div><label>Longitude</label><input id="lon" type="number" step="0.000001" inputmode="decimal" placeholder="83.546813"></div></div><button class="btn" onclick="setLocation()">Set Location</button><button class="btn secondary" onclick="clearLocation()">Clear</button><div id="status" class="status" style="display:none"></div></div>
<div class="card"><div class="coords"><b>Selected Location</b><br><span id="show">No location selected</span></div><div class="mapwrap" style="margin-top:12px"><iframe id="map" title="Map"></iframe><div class="pin">📍</div></div><div class="note">This simulated point changes the location displayed by this web app. It does not change the iPhone's system GPS or other apps' location.</div></div>
</main><script>
const latEl=document.getElementById('lat'),lonEl=document.getElementById('lon'),map=document.getElementById('map'),show=document.getElementById('show'),status=document.getElementById('status');
function valid(a,b){return Number.isFinite(a)&&Number.isFinite(b)&&a>=-90&&a<=90&&b>=-180&&b<=180}
function setLocation(){const lat=parseFloat(latEl.value),lon=parseFloat(lonEl.value);if(!valid(lat,lon)){alert('Please enter valid Latitude (-90 to 90) and Longitude (-180 to 180).');return} localStorage.setItem('simLat',lat);localStorage.setItem('simLon',lon);render(lat,lon)}
function render(lat,lon){show.innerHTML='<b>Latitude:</b> '+lat.toFixed(6)+'<br><b>Longitude:</b> '+lon.toFixed(6);status.style.display='block';status.textContent='Location set successfully in this app.';const d=0.015;const bbox=[lon-d,lat-d,lon+d,lat+d].join(',');map.src='https://www.openstreetmap.org/export/embed.html?bbox='+encodeURIComponent(bbox)+'&layer=mapnik&marker='+lat+','+lon;}
function clearLocation(){localStorage.removeItem('simLat');localStorage.removeItem('simLon');latEl.value='';lonEl.value='';show.textContent='No location selected';status.style.display='none';map.src='about:blank'}
const a=parseFloat(localStorage.getItem('simLat')),b=parseFloat(localStorage.getItem('simLon'));if(valid(a,b)){latEl.value=a;lonEl.value=b;render(a,b)}
</script></body></html>
